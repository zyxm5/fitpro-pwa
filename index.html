<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00D26A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FitPro" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <title>FitPro 健身</title>
  <link rel="stylesheet" href="./css/229.css" />
  <link rel="stylesheet" href="./css/270.css" />
  <link rel="stylesheet" href="./css/701.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body, #app { height: 100%; width: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background-color: #F5F7FA;
      color: #1D2129;
      overscroll-behavior: none;
    }
    #app { display: flex; flex-direction: column; }
    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #F5F7FA; color: #00D26A; font-size: 24px; font-weight: 600;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="loading">FitPro 加载中...</div>
  <div id="app"></div>
  <script>
    // Hide loader once app mounts
    window.addEventListener('load', function() {
      setTimeout(function() {
        var l = document.getElementById('loading');
        if (l) l.style.display = 'none';
      }, 800);
    });
  </script>
  <script src="./js/634.js"></script>
  <script src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(e) {
          console.log('SW registration failed:', e);
        });
      });
    }
  </script>
</body>
</html>
